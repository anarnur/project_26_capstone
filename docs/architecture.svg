  <line x1="560" y1="542" x2="510" y2="575" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="100" y="575" width="170" height="34" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="185" y="597" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">RAG · Qdrant</text>

  <rect x="410" y="575" width="180" height="34" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="500" y="597" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">LangSmith observability</text>
